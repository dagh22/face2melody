  <text x="160" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8b949e">DeepFace · VGG-Face</text>
  <line x1="80" y1="160" x2="240" y2="160" stroke="#7c3aed" stroke-width="0.5" opacity="0.4"/>
  <text x="160" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">7 classes → 4 émotions</text>
  <text x="160" y="195" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">EMA smoothing · gating</text>
  <text x="160" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">MediaPipe FaceMesh</text>

  <!-- Text/NLP Box -->
  <rect x="400" y="105" width="200" height="120" rx="10" fill="url(#text_grad)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">Texte (NLP)</text>
  <text x="500" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8b949e">HuggingFace · French</text>
  <line x1="420" y1="160" x2="580" y2="160" stroke="#2563eb" stroke-width="0.5" opacity="0.4"/>
  <text x="500" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">Analyse sémantique</text>
  <text x="500" y="195" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">Détection tonale</text>
  <text x="500" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">Chat conversationnel FR</text>

