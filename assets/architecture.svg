  <rect x="280" y="300" width="440" height="130" rx="10" fill="url(#agent_grad)" stroke="#d97706" stroke-width="2"/>
  <text x="500" y="326" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">EmotionFusionAgent</text>
  <text x="500" y="344" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#d97706">Claude Sonnet 4.6 · Late Fusion · XAI</text>
  <line x1="300" y1="355" x2="700" y2="355" stroke="#d97706" stroke-width="0.5" opacity="0.5"/>

