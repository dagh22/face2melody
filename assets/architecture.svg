  <text x="155" y="498" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1DB954">Spotify</text>
  <text x="155" y="515" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8b949e">Recommendations API</text>
  <line x1="80" y1="523" x2="230" y2="523" stroke="#1DB954" stroke-width="0.5" opacity="0.4"/>
  <text x="155" y="539" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">valence · energy · tempo</text>
  <text x="155" y="553" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">5 fallback strategies</text>
  <text x="155" y="567" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Premium requis</text>

