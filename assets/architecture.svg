  <text x="500" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6e7681">Fusion Trimodale · Agent LLM · Multi-Plateforme</text>

  <!-- Section label: Input Layer -->
  <text x="500" y="90" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#484f58" letter-spacing="2">── COUCHE D'ENTRÉE ──────────────────────────────────────────────────────</text>

  <!-- Vision Box -->
  <rect x="60" y="105" width="200" height="120" rx="10" fill="url(#vision_grad)" stroke="#7c3aed" stroke-width="1.5"/>
