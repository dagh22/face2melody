  <rect x="296" y="363" width="120" height="54" rx="6" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="356" y="381" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#fbbf24" font-weight="600">Arbitrage</text>
  <text x="356" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e">BPM+neutre→anxiété</text>
  <text x="356" y="408" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e">Faible lux→txt 70%</text>

  <rect x="430" y="363" width="140" height="54" rx="6" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="500" y="381" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#fbbf24" font-weight="600">Détection Avancée</text>
  <text x="500" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e">Sarcasme · Masquage</text>
  <text x="500" y="408" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e">Confiance adaptative</text>

  <rect x="584" y="363" width="120" height="54" rx="6" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="644" y="381" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#fbbf24" font-weight="600">Sortie JSON XAI</text>
  <text x="644" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e">Raisonnement tech</text>
  <text x="644" y="408" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e">Message empathique</text>

