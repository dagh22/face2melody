    <linearGradient id="agent_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="spotify_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1DB954;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="lastfm_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e4374b;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#e4374b;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="yt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="apple_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:0.4"/>
