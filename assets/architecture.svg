  <text x="840" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8b949e">BPM — Rythme cardiaque</text>
  <line x1="760" y1="160" x2="920" y2="160" stroke="#dc2626" stroke-width="0.5" opacity="0.4"/>
  <text x="840" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">Réel ou simulé</text>
  <text x="840" y="195" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">BPM &gt; 100 → stress</text>
  <text x="840" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6e7681">Arbitrage anxiété latente</text>

