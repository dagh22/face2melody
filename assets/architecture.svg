  <text x="370" y="515" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8b949e">Tag-based · Gratuit</text>
  <line x1="295" y1="523" x2="445" y2="523" stroke="#e4374b" stroke-width="0.5" opacity="0.4"/>
  <text x="370" y="539" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Émotion → tags Last.fm</text>
  <text x="370" y="553" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Historique personnalisé</text>
  <text x="370" y="567" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Sans quota Premium</text>

  <!-- YouTube -->
  <rect x="490" y="470" width="190" height="100" rx="10" fill="url(#yt_grad)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="585" y="498" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f87171">YouTube</text>
  <text x="585" y="515" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8b949e">Data API v3</text>
  <line x1="510" y1="523" x2="660" y2="523" stroke="#ef4444" stroke-width="0.5" opacity="0.4"/>
  <text x="585" y="539" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Vidéos embarquées</text>
  <text x="585" y="553" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Thumbnails · Embeds</text>
  <text x="585" y="567" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Fallback si quota épuisé</text>

  <!-- Apple Music -->
  <rect x="705" y="470" width="235" height="100" rx="10" fill="url(#apple_grad)" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="822" y="498" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#d1d5db">Apple Music</text>
  <text x="822" y="515" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8b949e">iTunes Search API</text>
  <line x1="725" y1="523" x2="920" y2="523" stroke="#9ca3af" stroke-width="0.5" opacity="0.4"/>
  <text x="822" y="539" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Embed URLs</text>
  <text x="822" y="553" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Sans authentification</text>
  <text x="822" y="567" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6e7681">Enrichissement Last.fm</text>

  <!-- Arrows from agent to platforms -->
  <line x1="400" y1="440" x2="180" y2="468" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow_green)"/>
  <line x1="450" y1="440" x2="370" y2="468" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow_green)"/>
  <line x1="550" y1="440" x2="585" y2="468" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow_green)"/>
  <line x1="600" y1="440" x2="780" y2="468" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow_green)"/>

  <!-- Bottom label -->
  <text x="500" y="600" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#484f58">M.Sc. Intelligence Artificielle · UQAM · github.com/dagh22/face2melody</text>
</svg>
