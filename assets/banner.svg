<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="pill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="pill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="pill3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
  </g>

  <!-- Glowing orbs in background -->
  <circle cx="200" cy="200" r="120" fill="#7c3aed" opacity="0.06" filter="url(#softglow)"/>
  <circle cx="1080" cy="200" r="120" fill="#059669" opacity="0.06" filter="url(#softglow)"/>
  <circle cx="640" cy="80" r="80" fill="#2563eb" opacity="0.05" filter="url(#softglow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- Left decorative signal waves -->
  <g opacity="0.15" stroke="#7c3aed" stroke-width="1.5" fill="none">
    <path d="M 60 160 Q 80 140 100 160 Q 120 180 140 160"/>
    <path d="M 60 180 Q 80 150 100 180 Q 120 210 140 180"/>
    <path d="M 60 200 Q 90 160 100 200 Q 110 240 140 200"/>
  </g>

  <!-- Right decorative music notes area -->
  <g opacity="0.12" fill="#059669">
    <circle cx="1160" cy="150" r="8"/>
    <rect x="1168" y="115" width="2" height="35"/>
    <rect x="1168" y="115" width="18" height="2"/>
    <circle cx="1185" cy="165" r="8"/>
    <rect x="1193" y="130" width="2" height="35"/>
    <circle cx="1210" cy="145" r="7"/>
    <rect x="1217" y="112" width="2" height="33"/>
    <rect x="1193" y="130" width="24" height="2"/>
  </g>

  <!-- Main title -->
  <text x="640" y="155" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#accent)" filter="url(#glow)">Face2Melody</text>

  <!-- Subtitle -->
  <text x="640" y="200" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="300" fill="#8b949e" letter-spacing="1">Compagnon Émotionnel par IA Affective · V3</text>

  <!-- Divider line -->
  <rect x="490" y="218" width="300" height="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Feature pills -->
  <!-- Pill 1: Vision -->
  <rect x="200" y="255" width="170" height="38" rx="19" fill="url(#pill1)" stroke="#7c3aed" stroke-width="1" opacity="0.8"/>
  <text x="285" y="279" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#a78bfa">Vision (VGG-Face)</text>

  <!-- Pill 2: NLP -->
  <rect x="390" y="255" width="150" height="38" rx="19" fill="url(#pill2)" stroke="#2563eb" stroke-width="1" opacity="0.8"/>
  <text x="465" y="279" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">Texte (NLP FR)</text>

  <!-- Pill 3: BPM -->
  <rect x="560" y="255" width="160" height="38" rx="19" fill="url(#pill1)" stroke="#7c3aed" stroke-width="1" opacity="0.8"/>
  <text x="640" y="279" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#a78bfa">Physiologie (BPM)</text>

  <!-- Pill 4: Agent -->
  <rect x="740" y="255" width="160" height="38" rx="19" fill="url(#pill2)" stroke="#2563eb" stroke-width="1" opacity="0.8"/>
  <text x="820" y="279" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">Claude Sonnet 4.6</text>

  <!-- Pill 5: Multi-platform -->
  <rect x="920" y="255" width="180" height="38" rx="19" fill="url(#pill3)" stroke="#059669" stroke-width="1" opacity="0.8"/>
  <text x="1010" y="279" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#34d399">4 Plateformes</text>

  <!-- Bottom metadata -->
  <text x="640" y="345" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#484f58">M.Sc. Intelligence Artificielle · UQAM · Affective Computing &amp; XAI</text>

  <!-- Bottom tech badges row -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6e7681">
    <text x="340" y="372" text-anchor="middle">🎵 Spotify</text>
    <text x="460" y="372" text-anchor="middle">🎵 Last.fm</text>
    <text x="580" y="372" text-anchor="middle">▶ YouTube</text>
    <text x="700" y="372" text-anchor="middle"> Apple Music</text>
    <text x="840" y="372" text-anchor="middle">🧠 DeepFace</text>
    <text x="960" y="372" text-anchor="middle">⚡ Streamlit</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="397" width="1280" height="3" fill="url(#accent)"/>
</svg>
